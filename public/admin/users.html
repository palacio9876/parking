<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkSystem - Usuarios</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/tailwind.css" rel="stylesheet">
    <link href="/css/dashboard.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script>
        if(!localStorage.getItem('token')){window.location.href='/';}
        if(localStorage.getItem('userRole')!=='admin'){window.location.href='/admin/dashboard';}
    </script>
    <script>document.addEventListener('DOMContentLoaded',()=>{const r=localStorage.getItem('userRole');if(r!=='admin'){document.querySelectorAll('.admin-only').forEach(e=>e.classList.add('hidden'))}});</script>
</head>
<body class="font-poppins bg-gray-100">
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo-container"><div class="logo-circle"><img id="sidebarLogo" src="" alt="Logo" style="display:none"><span class="logo-text">PS</span></div></div>
            <h5 class="mt-3 text-white text-lg font-semibold">ParkSystem</h5>
        </div>
        <nav class="sidebar-nav">
            <ul class="flex flex-col">
                <li class="nav-item"><a href="/admin/dashboard" class="nav-link"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a></li>
                <li class="nav-item"><a href="/admin/vehicles" class="nav-link"><i class="fas fa-car"></i><span>Vehículos</span></a></li>
                <li class="nav-item"><a href="/admin/entry-exit" class="nav-link"><i class="fas fa-right-left"></i><span>Ingreso / Salida</span></a></li>
                <li class="nav-item"><a href="#" class="nav-link" onclick="openShiftModal(); return false;"><i class="fas fa-cash-register"></i><span>Turnos</span></a></li>
                <li class="nav-item admin-only"><a href="/admin/settings" class="nav-link"><i class="fas fa-gear"></i><span>Configuración</span></a></li>
                <li class="nav-item admin-only"><a href="/admin/rates" class="nav-link"><i class="fas fa-money-bill-wave"></i><span>Tarifas</span></a></li>
                <li class="nav-item admin-only"><a href="/admin/users" class="nav-link active"><i class="fas fa-users"></i><span>Usuarios</span></a></li>
                <li class="nav-item admin-only"><a href="/admin/reports" class="nav-link"><i class="fas fa-chart-bar"></i><span>Reportes</span></a></li>
            </ul>
        </nav>
        <div class="sidebar-footer"><a href="#" class="nav-link" id="btnLogout"><i class="fas fa-sign-out-alt"></i><span>Cerrar Sesión</span></a></div>
    </div>

    <div class="main-content">
        <nav class="navbar-custom bg-white shadow-sm flex items-center justify-between">
            <div class="flex items-center gap-2">
                <button class="sidebar-toggle px-4 py-2 text-primary hover:text-primary-dark transition-colors" title="Toggle sidebar">
                    <i class="fas fa-bars text-xl"></i>
                </button>
            </div>
            <div class="flex items-center gap-3 px-4">
                <div class="h-5 w-px bg-gray-200"></div>
                <span class="flex items-center gap-2 text-gray-700 text-sm font-medium">
                    <i class="fas fa-user-circle text-lg text-primary"></i>
                    <span id="userName">Usuario</span>
                </span>
            </div>
        </nav>

        <div class="w-full px-6 py-4">
            <div class="bg-white rounded-xl shadow-sm">
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                    <h5 class="text-lg font-semibold text-gray-900 mb-0">Gestión de Usuarios</h5>
                    <button class="inline-flex items-center px-4 py-2 bg-primary text-white text-sm font-medium rounded-lg hover:bg-primary-dark transition-colors" data-bs-toggle="modal" data-bs-target="#userModal">
                        <i class="fas fa-user-plus mr-2"></i><span>Nuevo Usuario</span>
                    </button>
                </div>
                <div class="p-6">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left" id="usersTable">
                            <thead>
                                <tr>
                                    <th class="text-sm font-semibold text-gray-500 pb-3">Nombre</th>
                                    <th class="text-sm font-semibold text-gray-500 pb-3">Usuario</th>
                                    <th class="text-sm font-semibold text-gray-500 pb-3">Rol</th>
                                    <th class="text-sm font-semibold text-gray-500 pb-3">Activo</th>
                                    <th class="text-sm font-semibold text-gray-500 pb-3">Último acceso</th>
                                    <th class="text-sm font-semibold text-gray-500 pb-3">Acciones</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-white rounded-xl shadow-2xl border-0">
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between rounded-t-xl">
                    <h5 class="text-lg font-semibold" id="userModalTitle">Nuevo Usuario</h5>
                    <button type="button" class="text-gray-400 hover:text-gray-600 transition-colors" data-bs-dismiss="modal"><i class="fas fa-times"></i></button>
                </div>
                <div class="p-6">
                    <form id="userForm">
                        <input type="hidden" id="userId">
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                            <input type="text" id="name" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-sm" required>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                            <input type="text" id="username" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-sm" required>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                            <input type="password" id="password" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-sm" required>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Rol</label>
                            <select id="role" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-sm" required>
                                <option value="admin">Administrador</option>
                                <option value="operator">Operador</option>
                            </select>
                        </div>
                        <div class="flex items-center">
                            <input class="h-4 w-4 text-primary border-gray-300 rounded focus:ring-primary" type="checkbox" id="active" checked>
                            <label class="ml-2 text-sm text-gray-600" for="active">Activo</label>
                        </div>
                    </form>
                </div>
                <div class="px-6 py-4 border-t border-gray-100 flex items-center justify-end gap-2 rounded-b-xl">
                    <button type="button" class="px-4 py-2 bg-gray-200 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-300 transition-colors" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="px-4 py-2 bg-primary text-white text-sm font-medium rounded-lg hover:bg-primary-dark transition-colors" id="btnSaveUser">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="passwordModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-white rounded-xl shadow-2xl border-0">
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between rounded-t-xl">
                    <h5 class="text-lg font-semibold">Cambiar contraseña</h5>
                    <button type="button" class="text-gray-400 hover:text-gray-600 transition-colors" data-bs-dismiss="modal"><i class="fas fa-times"></i></button>
                </div>
                <div class="p-6">
                    <form id="passwordForm">
                        <input type="hidden" id="pwd_user_id">
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                            <input type="text" id="pwd_user_login" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg bg-gray-50 text-sm" disabled>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nueva contraseña</label>
                            <div class="flex">
                                <input type="password" id="pwd_new" class="w-full px-3 py-2.5 border border-gray-300 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-sm" required>
                                <button class="px-3 border border-l-0 border-gray-300 bg-white text-gray-700 rounded-r-lg hover:bg-gray-50 transition-colors" type="button" id="pwd_toggle"><i class="fas fa-eye"></i></button>
                            </div>
                            <div class="text-xs text-gray-500 mt-1">Mínimo 6 caracteres.</div>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar contraseña</label>
                            <input type="password" id="pwd_confirm" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-sm" required>
                        </div>
                        <div class="hidden p-3 rounded-lg text-sm" id="pwd_alert"></div>
                    </form>
                </div>
                <div class="px-6 py-4 border-t border-gray-100 flex items-center justify-end gap-2 rounded-b-xl">
                    <button type="button" class="px-4 py-2 bg-gray-200 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-300 transition-colors" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="px-4 py-2 bg-primary text-white text-sm font-medium rounded-lg hover:bg-primary-dark transition-colors" id="btnPwdSave">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/footer.js"></script>
    <script src="/js/users.js"></script>
    <script src="/js/shifts.js"></script>
    <script src="/js/sidebar-logo.js"></script>
</body>
</html>
