<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="entryExit.title">ParkSystem - Ingreso / Salida</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/tailwind.css" rel="stylesheet">
    <link href="/css/dashboard.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script>if(!localStorage.getItem('token')){window.location.href='/';}</script>
</head>
<body class="font-poppins bg-gray-100">
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo-container"><div class="logo-circle"><span class="logo-text">PS</span></div></div>
            <h5 class="mt-3 text-white text-lg font-semibold">ParkSystem</h5>
        </div>
        <nav class="sidebar-nav">
            <ul class="flex flex-col">
                <li class="nav-item"><a href="/admin/dashboard" class="nav-link"><i class="fas fa-tachometer-alt"></i><span data-i18n="sidebar.dashboard">Dashboard</span></a></li>
                <li class="nav-item"><a href="/admin/vehicles" class="nav-link"><i class="fas fa-car"></i><span data-i18n="sidebar.vehicles">Vehículos</span></a></li>
                <li class="nav-item"><a href="/admin/entry-exit" class="nav-link active"><i class="fas fa-right-left"></i><span data-i18n="sidebar.entryExit">Ingreso / Salida</span></a></li>
                <li class="nav-item admin-only"><a href="/admin/settings" class="nav-link"><i class="fas fa-gear"></i><span data-i18n="sidebar.settings">Configuración</span></a></li>
                <li class="nav-item admin-only"><a href="/admin/rates" class="nav-link"><i class="fas fa-money-bill-wave"></i><span data-i18n="sidebar.rates">Tarifas</span></a></li>
                <li class="nav-item admin-only"><a href="/admin/users" class="nav-link"><i class="fas fa-users"></i><span data-i18n="sidebar.users">Usuarios</span></a></li>
                <li class="nav-item admin-only"><a href="/admin/reports" class="nav-link"><i class="fas fa-chart-bar"></i><span data-i18n="sidebar.reports">Reportes</span></a></li>
            </ul>
        </nav>
        <div class="sidebar-footer"><a href="#" class="nav-link" id="btnLogout"><i class="fas fa-sign-out-alt"></i><span data-i18n="sidebar.logout">Cerrar Sesión</span></a></div>
    </div>

    <div class="main-content">
        <nav class="navbar-custom bg-white shadow-sm flex items-center justify-between">
            <div class="flex items-center gap-2">
                <button class="sidebar-toggle px-4 py-2 text-primary hover:text-primary-dark transition-colors" title="Toggle sidebar">
                    <i class="fas fa-bars text-xl"></i>
                </button>
            </div>
            <div class="flex items-center gap-3 px-4">
                <div class="lang-switcher"></div>
                <div class="h-5 w-px bg-gray-200"></div>
                <span class="flex items-center gap-2 text-gray-700 text-sm font-medium">
                    <i class="fas fa-user-circle text-lg text-primary"></i>
                    <span id="userName">Usuario</span>
                </span>
            </div>
        </nav>

        <div class="w-full px-6 py-4">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="bg-white rounded-xl shadow-sm">
                    <div class="px-6 py-4 border-b border-gray-100">
                        <h5 class="text-lg font-semibold text-gray-900 mb-0"><i class="fas fa-right-to-bracket mr-2 text-green-500"></i><span data-i18n="entryExit.entry">Ingreso rápido</span></h5>
                    </div>
                    <div class="p-6">
                        <form id="formIngreso" class="grid grid-cols-12 gap-3">
                            <div class="col-span-12 md:col-span-5">
                                <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="entryExit.plate">Placa</label>
                                <input type="text" id="ingPlaca" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-sm" data-i18n="entryExit.platePlaceholder" data-i18n-attr="placeholder" placeholder="ABC123" required>
                            </div>
                            <div class="col-span-12 md:col-span-5">
                                <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="entryExit.type">Tipo</label>
                                <div class="veh-tipo-toggle flex gap-2">
                                    <input type="radio" class="btn-check hidden" name="ingTipo" id="tipoCarro" autocomplete="off" value="car">
                                    <label class="flex items-center justify-center px-3 py-2 border-2 border-primary text-primary rounded-lg cursor-pointer hover:bg-primary hover:text-white transition-colors text-sm gap-1 flex-1 min-w-[90px]" for="tipoCarro" title="Carro"><i class="fas fa-car-side"></i><span data-i18n="entryExit.car">Carro</span></label>
                                    <input type="radio" class="btn-check hidden" name="ingTipo" id="tipoMoto" autocomplete="off" value="motorcycle">
                                    <label class="flex items-center justify-center px-3 py-2 border-2 border-primary text-primary rounded-lg cursor-pointer hover:bg-primary hover:text-white transition-colors text-sm gap-1 flex-1 min-w-[90px]" for="tipoMoto" title="Moto"><i class="fas fa-motorcycle"></i><span data-i18n="entryExit.motorcycle">Moto</span></label>
                                    <input type="radio" class="btn-check hidden" name="ingTipo" id="tipoBici" autocomplete="off" value="bicycle">
                                    <label class="flex items-center justify-center px-3 py-2 border-2 border-primary text-primary rounded-lg cursor-pointer hover:bg-primary hover:text-white transition-colors text-sm gap-1 flex-1 min-w-[90px]" for="tipoBici" title="Bicicleta"><i class="fas fa-bicycle"></i><span data-i18n="entryExit.bicycle">Bicicleta</span></label>
                                </div>
                            </div>
                            <div class="col-span-12 md:col-span-2 flex items-end">
                                <button class="w-full bg-green-500 text-white font-medium px-4 py-2.5 rounded-lg hover:bg-green-600 transition-colors text-sm" type="submit"><i class="fas fa-play mr-2"></i><span data-i18n="entryExit.enter">Ingresar</span></button>
                            </div>
                        </form>
                        <div id="compIngreso" class="mt-6 hidden print-area">
                            <h6 class="font-semibold" data-i18n="entryExit.receiptEntry">Comprobante de Ingreso</h6>
                            <div class="receipt" id="compIngresoBody"></div>
                            <div class="no-print mt-2 flex gap-2">
                                <button class="px-3 py-1.5 text-sm border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors" id="btnPrintIngreso58"><i class="fas fa-print mr-1"></i><span data-i18n="entryExit.print58">Imprimir 58mm</span></button>
                                <button class="px-3 py-1.5 text-sm border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors" id="btnPrintIngreso80"><i class="fas fa-print mr-1"></i><span data-i18n="entryExit.print80">Imprimir 80mm</span></button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm">
                    <div class="px-6 py-4 border-b border-gray-100">
                        <h5 class="text-lg font-semibold text-gray-900 mb-0"><i class="fas fa-right-from-bracket mr-2 text-red-500"></i><span data-i18n="entryExit.exit">Salida y cobro</span></h5>
                    </div>
                    <div class="p-6">
                        <form id="formSalida" class="grid grid-cols-12 gap-3">
                            <div class="col-span-12 md:col-span-5">
                                <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="entryExit.plate">Placa</label>
                                <input type="text" id="salPlaca" list="salPlacaList" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-sm" data-i18n="entryExit.platePlaceholder" data-i18n-attr="placeholder" placeholder="ABC123" required>
                                <datalist id="salPlacaList"></datalist>
                            </div>
                            <div class="col-span-12 md:col-span-4">
                                <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="entryExit.paymentMethod">Método de pago</label>
                                <select id="salMetodo" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-sm">
                                    <option value="cash" data-i18n="entryExit.cash">Efectivo</option>
                                    <option value="card" data-i18n="entryExit.card">Tarjeta</option>
                                    <option value="QR" data-i18n="entryExit.qr">QR</option>
                                </select>
                            </div>
                            <div class="col-span-12 md:col-span-3 flex items-end">
                                <button class="w-full bg-red-500 text-white font-medium px-4 py-2.5 rounded-lg hover:bg-red-600 transition-colors text-sm" type="submit"><i class="fas fa-stop mr-2"></i><span data-i18n="entryExit.finish">Finalizar</span></button>
                            </div>
                        </form>
                        <div id="compSalida" class="mt-6 hidden print-area">
                            <h6 class="font-semibold" data-i18n="entryExit.receiptExit">Factura</h6>
                            <div class="receipt" id="compSalidaBody"></div>
                            <div class="no-print mt-2 flex gap-2">
                                <button class="px-3 py-1.5 text-sm border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors" id="btnPrintSalida58"><i class="fas fa-print mr-1"></i><span data-i18n="entryExit.print58">Imprimir 58mm</span></button>
                                <button class="px-3 py-1.5 text-sm border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors" id="btnPrintSalida80"><i class="fas fa-print mr-1"></i><span data-i18n="entryExit.print80">Imprimir 80mm</span></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="pagoModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-white rounded-xl shadow-2xl border-0">
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between rounded-t-xl">
                    <h5 class="text-lg font-semibold" data-i18n="entryExit.registerPayment">Registrar Pago</h5>
                    <button type="button" class="text-gray-400 hover:text-gray-600 transition-colors" data-bs-dismiss="modal"><i class="fas fa-times"></i></button>
                </div>
                <div class="p-6">
                    <div class="mb-2"><strong class="text-sm" data-i18n="common.total">Total:</strong> <span id="pagoTotal" class="text-sm"></span></div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1" data-i18n="entryExit.addPaymentMethod">Agregar medios de pago</label>
                        <div id="pagosContainer" class="flex flex-col gap-2"></div>
                        <button class="mt-2 px-3 py-1.5 text-sm border-2 border-primary text-primary rounded-lg hover:bg-primary hover:text-white transition-colors" id="btnAddPago"><i class="fas fa-plus mr-1"></i><span data-i18n="entryExit.addPayment">Agregar pago</span></button>
                    </div>
                    <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 text-sm text-blue-700">
                        <div><span data-i18n="entryExit.paid">Pagado:</span> <strong id="pagoSum"></strong></div>
                        <div><span data-i18n="entryExit.difference">Diferencia:</span> <strong id="pagoDiff"></strong></div>
                    </div>
                </div>
                <div class="px-6 py-4 border-t border-gray-100 flex items-center justify-end gap-2 rounded-b-xl">
                    <button type="button" class="px-4 py-2 bg-gray-200 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-300 transition-colors" data-bs-dismiss="modal" data-i18n="common.cancel">Cancelar</button>
                    <button type="button" class="px-4 py-2 bg-green-500 text-white text-sm font-medium rounded-lg hover:bg-green-600 transition-colors" id="btnConfirmPagos" data-i18n="entryExit.confirmPayments">Confirmar pagos</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/footer.js"></script>
    <script src="/js/shifts.js"></script>
    <script src="/js/entry-exit.js"></script>
</body>
</html>
