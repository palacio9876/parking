<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="entryExit.title">ParkSystem - Ingreso / Salida</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/dashboard.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-bootstrap-4/bootstrap-4.min.css">
    <style>
        body{font-family:'Poppins',sans-serif}.card{border:none;box-shadow:0 0 15px rgba(0,0,0,.05)}.receipt{font-size:.95rem}.receipt h6{font-weight:600}.print-area{background:#fff}@media print{.no-print{display:none!important}.print-area{box-shadow:none!important}}.veh-tipo-toggle .btn{border-width:2px;padding:0.5rem 0.75rem;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;flex:1 0 110px;min-width:110px;white-space:nowrap}.veh-tipo-toggle .btn i{font-size:1.1rem}.btn-check:checked+.btn{border-color:var(--bs-primary);color:#fff;background-color:var(--bs-primary);box-shadow:0 0 0 .2rem rgba(13,110,253,.15)}.veh-tipo-toggle{gap:.5rem;width:100%;display:flex;flex-wrap:wrap}
    </style>
    <script>if(!localStorage.getItem('token')){window.location.href='/';}</script>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo-container"><div class="logo-circle"><span class="logo-text">PS</span></div></div>
            <h5 class="mt-3 text-white">ParkSystem</h5>
        </div>
        <nav class="sidebar-nav">
            <ul class="nav flex-column">
                <li class="nav-item"><a href="/admin/dashboard" class="nav-link"><i class="fas fa-tachometer-alt"></i><span data-i18n="sidebar.dashboard">Dashboard</span></a></li>
                <li class="nav-item"><a href="/admin/vehicles" class="nav-link"><i class="fas fa-car"></i><span data-i18n="sidebar.vehicles">Vehículos</span></a></li>
                <li class="nav-item"><a href="/admin/entry-exit" class="nav-link active"><i class="fas fa-right-left"></i><span data-i18n="sidebar.entryExit">Ingreso / Salida</span></a></li>
                <li class="nav-item admin-only"><a href="/admin/settings" class="nav-link"><i class="fas fa-gear"></i><span data-i18n="sidebar.settings">Configuración</span></a></li>
                <li class="nav-item admin-only"><a href="/admin/rates" class="nav-link"><i class="fas fa-money-bill-wave"></i><span data-i18n="sidebar.rates">Tarifas</span></a></li>
                <li class="nav-item admin-only"><a href="/admin/users" class="nav-link"><i class="fas fa-users"></i><span data-i18n="sidebar.users">Usuarios</span></a></li>
                <li class="nav-item admin-only"><a href="/admin/reports" class="nav-link"><i class="fas fa-chart-bar"></i><span data-i18n="sidebar.reports">Reportes</span></a></li>
            </ul>
        </nav>
        <div class="sidebar-footer"><a href="#" class="nav-link" id="btnLogout"><i class="fas fa-sign-out-alt"></i><span data-i18n="sidebar.logout">Cerrar Sesión</span></a></div>
    </div>

    <div class="main-content">
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
            <div class="container-fluid">
                <button class="btn btn-link sidebar-toggle"><i class="fas fa-bars"></i></button>
                <div class="navbar-collapse"><ul class="navbar-nav ms-auto"><li class="nav-item"><span class="nav-link"><i class="fas fa-user-circle me-2"></i><span id="userName">Usuario</span></span></li></ul></div>
            </div>
        </nav>

        <div class="container-fluid py-4">
            <div class="row g-4">
                <div class="col-12 col-lg-6">
                    <div class="card">
                        <div class="card-header bg-white"><h5 class="mb-0"><i class="fas fa-right-to-bracket me-2 text-success"></i><span data-i18n="entryExit.entry">Ingreso rápido</span></h5></div>
                        <div class="card-body">
                            <form id="formIngreso" class="row g-3">
                                <div class="col-md-5">
                                    <label class="form-label" data-i18n="entryExit.plate">Placa</label>
                                    <input type="text" id="ingPlaca" class="form-control" data-i18n="entryExit.platePlaceholder" data-i18n-attr="placeholder" placeholder="ABC123" required>
                                </div>
                                <div class="col-12 col-md-6 col-lg-5">
                                    <label class="form-label" data-i18n="entryExit.type">Tipo</label>
                                    <div class="veh-tipo-toggle d-flex">
                                        <input type="radio" class="btn-check" name="ingTipo" id="tipoCarro" autocomplete="off" value="car">
                                        <label class="btn btn-outline-primary" for="tipoCarro" title="Carro"><i class="fas fa-car-side"></i><span class="d-none d-md-inline" data-i18n="entryExit.car">Carro</span></label>
                                        <input type="radio" class="btn-check" name="ingTipo" id="tipoMoto" autocomplete="off" value="motorcycle">
                                        <label class="btn btn-outline-primary" for="tipoMoto" title="Moto"><i class="fas fa-motorcycle"></i><span class="d-none d-md-inline" data-i18n="entryExit.motorcycle">Moto</span></label>
                                        <input type="radio" class="btn-check" name="ingTipo" id="tipoBici" autocomplete="off" value="bicycle">
                                        <label class="btn btn-outline-primary" for="tipoBici" title="Bicicleta"><i class="fas fa-bicycle"></i><span class="d-none d-md-inline" data-i18n="entryExit.bicycle">Bici</span></label>
                                    </div>
                                </div>
                                <div class="col-12 col-md-3 col-lg-2 d-flex align-items-end mt-2 mt-md-0">
                                    <button class="btn btn-success w-100" type="submit"><i class="fas fa-play me-2"></i><span data-i18n="entryExit.enter">Ingresar</span></button>
                                </div>
                            </form>
                            <div id="compIngreso" class="mt-4 d-none print-area">
                                <h6 data-i18n="entryExit.receiptEntry">Comprobante de Ingreso</h6>
                                <div class="receipt" id="compIngresoBody"></div>
                                <div class="no-print mt-2 d-flex gap-2">
                                    <button class="btn btn-outline-secondary btn-sm" id="btnPrintIngreso58"><i class="fas fa-print me-1"></i><span data-i18n="entryExit.print58">Imprimir 58mm</span></button>
                                    <button class="btn btn-outline-secondary btn-sm" id="btnPrintIngreso80"><i class="fas fa-print me-1"></i><span data-i18n="entryExit.print80">Imprimir 80mm</span></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-lg-6">
                    <div class="card">
                        <div class="card-header bg-white"><h5 class="mb-0"><i class="fas fa-right-from-bracket me-2 text-danger"></i><span data-i18n="entryExit.exit">Salida y cobro</span></h5></div>
                        <div class="card-body">
                            <form id="formSalida" class="row g-3">
                                <div class="col-md-5">
                                    <label class="form-label" data-i18n="entryExit.plate">Placa</label>
                                    <input type="text" id="salPlaca" class="form-control" data-i18n="entryExit.platePlaceholder" data-i18n-attr="placeholder" placeholder="ABC123" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" data-i18n="entryExit.paymentMethod">Método de pago</label>
                                    <select id="salMetodo" class="form-select">
                                        <option value="cash" data-i18n="entryExit.cash">Efectivo</option>
                                        <option value="card" data-i18n="entryExit.card">Tarjeta</option>
                                        <option value="QR" data-i18n="entryExit.qr">QR</option>
                                    </select>
                                </div>
                                <div class="col-md-3 d-flex align-items-end">
                                    <button class="btn btn-danger w-100" type="submit"><i class="fas fa-stop me-2"></i><span data-i18n="entryExit.finish">Finalizar</span></button>
                                </div>
                            </form>
                            <div id="compSalida" class="mt-4 d-none print-area">
                                <h6 data-i18n="entryExit.receiptExit">Factura</h6>
                                <div class="receipt" id="compSalidaBody"></div>
                                <div class="no-print mt-2 d-flex gap-2">
                                    <button class="btn btn-outline-secondary btn-sm" id="btnPrintSalida58"><i class="fas fa-print me-1"></i><span data-i18n="entryExit.print58">Imprimir 58mm</span></button>
                                    <button class="btn btn-outline-secondary btn-sm" id="btnPrintSalida80"><i class="fas fa-print me-1"></i><span data-i18n="entryExit.print80">Imprimir 80mm</span></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="pagoModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n="entryExit.registerPayment">Registrar Pago</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-2"><strong data-i18n="common.total">Total:</strong> <span id="pagoTotal"></span></div>
                    <div class="mb-3">
                        <label class="form-label" data-i18n="entryExit.addPaymentMethod">Agregar medios de pago</label>
                        <div id="pagosContainer" class="d-flex flex-column gap-2"></div>
                        <button class="btn btn-outline-primary btn-sm mt-2" id="btnAddPago"><i class="fas fa-plus me-1"></i><span data-i18n="entryExit.addPayment">Agregar pago</span></button>
                    </div>
                    <div class="alert alert-info py-2">
                        <div><span data-i18n="entryExit.paid">Pagado:</span> <strong id="pagoSum"></strong></div>
                        <div><span data-i18n="entryExit.difference">Diferencia:</span> <strong id="pagoDiff"></strong></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="common.cancel">Cancelar</button>
                    <button type="button" class="btn btn-success" id="btnConfirmPagos" data-i18n="entryExit.confirmPayments">Confirmar pagos</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/footer.js"></script>
    <script src="/js/shifts.js"></script>
    <script src="/js/entry-exit.js"></script>
</body>
</html>
