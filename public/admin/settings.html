<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkSystem - Configuración</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/tailwind.css" rel="stylesheet">
    <link href="/css/dashboard.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script>if(!localStorage.getItem('token')){window.location.href='/';}if(localStorage.getItem('userRole')!=='admin'){window.location.href='/admin/dashboard';}</script>
</head>
<body class="font-poppins bg-gray-100">
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo-container"><div class="logo-circle"><img id="sidebarLogo" src="" alt="Logo" style="display:none"><span class="logo-text">PS</span></div></div>
            <h5 class="mt-3 text-white text-lg font-semibold">ParkSystem</h5>
        </div>
        <nav class="sidebar-nav">
            <ul class="flex flex-col">
                <li class="nav-item"><a href="/admin/dashboard" class="nav-link"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a></li>
                <li class="nav-item"><a href="/admin/vehicles" class="nav-link"><i class="fas fa-car"></i><span>Vehículos</span></a></li>
                <li class="nav-item"><a href="/admin/entry-exit" class="nav-link"><i class="fas fa-right-left"></i><span>Ingreso / Salida</span></a></li>
                <li class="nav-item"><a href="#" class="nav-link" onclick="openShiftModal(); return false;"><i class="fas fa-cash-register"></i><span>Turnos</span></a></li>
                <li class="nav-item admin-only"><a href="/admin/settings" class="nav-link active"><i class="fas fa-gear"></i><span>Configuración</span></a></li>
                <li class="nav-item admin-only"><a href="/admin/rates" class="nav-link"><i class="fas fa-money-bill-wave"></i><span>Tarifas</span></a></li>
                <li class="nav-item admin-only"><a href="/admin/users" class="nav-link"><i class="fas fa-users"></i><span>Usuarios</span></a></li>
                <li class="nav-item admin-only"><a href="/admin/reports" class="nav-link"><i class="fas fa-chart-bar"></i><span>Reportes</span></a></li>
            </ul>
        </nav>
        <div class="sidebar-footer"><a href="#" class="nav-link" id="btnLogout"><i class="fas fa-sign-out-alt"></i><span>Cerrar Sesión</span></a></div>
    </div>

    <div class="main-content">
        <nav class="navbar-custom bg-white shadow-sm flex items-center justify-between">
            <div class="flex items-center gap-2">
                <button class="sidebar-toggle px-4 py-2 text-primary hover:text-primary-dark transition-colors" title="Toggle sidebar">
                    <i class="fas fa-bars text-xl"></i>
                </button>
            </div>
            <div class="flex items-center gap-3 px-4">
                <div class="h-5 w-px bg-gray-200"></div>
                <span class="flex items-center gap-2 text-gray-700 text-sm font-medium">
                    <i class="fas fa-user-circle text-lg text-primary"></i>
                    <span id="userName">Usuario</span>
                </span>
            </div>
        </nav>

        <div class="w-full px-6 py-4">
            <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                <div class="bg-white rounded-xl shadow-sm">
                    <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                        <h5 class="text-lg font-semibold text-gray-900 mb-0"><i class="fas fa-building mr-2"></i><span>Datos de la Empresa</span></h5>
                        <button class="inline-flex items-center px-3 py-1.5 bg-primary text-white text-sm font-medium rounded-lg hover:bg-primary-dark transition-colors" id="btnSaveCompany"><i class="fas fa-save mr-1"></i><span>Guardar</span></button>
                    </div>
                    <div class="p-6">
                        <form id="formEmpresa" class="grid grid-cols-12 gap-4">
                            <div class="col-span-12 md:col-span-8">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                                <input type="text" id="e_name" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-sm" required>
                            </div>
                            <div class="col-span-12 md:col-span-4">
                                <label class="block text-sm font-medium text-gray-700 mb-1">NIT</label>
                                <input type="text" id="e_tax_id" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-sm" required>
                            </div>
                            <div class="col-span-12 md:col-span-8">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Dirección</label>
                                <input type="text" id="e_address" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-sm">
                            </div>
                            <div class="col-span-12 md:col-span-4">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
                                <input type="text" id="e_phone" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-sm">
                            </div>
                            <div class="col-span-12 md:col-span-8">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                <input type="email" id="e_email" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-sm">
                            </div>
                            <div class="col-span-12 md:col-span-4">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Logo</label>
                                <input type="file" id="e_logo_file" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" accept="image/*">
                                <div class="mt-2">
                                    <img id="e_logo_preview" src="" alt="Vista previa" class="rounded border hidden" style="max-height:80px">
                                </div>
                                <button type="button" id="btnUploadLogo" class="inline-flex items-center mt-2 px-3 py-1.5 text-sm border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors"><i class="fas fa-upload mr-1"></i><span>Subir</span></button>
                            </div>
                            <div class="col-span-12">
                                <div id="alertCompany" class="hidden p-3 rounded-lg text-sm" role="alert"></div>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm">
                    <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                        <h5 class="text-lg font-semibold text-gray-900 mb-0"><i class="fas fa-sliders mr-2"></i><span>Configuración</span></h5>
                        <button class="inline-flex items-center px-3 py-1.5 bg-primary text-white text-sm font-medium rounded-lg hover:bg-primary-dark transition-colors" id="btnSaveSettings"><i class="fas fa-save mr-1"></i><span>Guardar</span></button>
                    </div>
                    <div class="p-6">
                        <form id="formConfig" class="grid grid-cols-12 gap-4">
                            <div class="col-span-12 md:col-span-4">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Cap. Carros</label>
                                <input type="number" min="0" id="c_cars" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-sm" required>
                            </div>
                            <div class="col-span-12 md:col-span-4">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Cap. Motos</label>
                                <input type="number" min="0" id="c_motos" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-sm" required>
                            </div>
                            <div class="col-span-12 md:col-span-4">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Cap. Bicicletas</label>
                                <input type="number" min="0" id="c_bicis" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-sm" required>
                            </div>
                            <div class="col-span-12 md:col-span-6">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Apertura</label>
                                <input type="time" id="c_opening" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-sm" required>
                            </div>
                            <div class="col-span-12 md:col-span-6">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Cierre</label>
                                <input type="time" id="c_closing" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-sm" required>
                            </div>
                            <div class="col-span-12">
                                <label class="relative inline-flex items-center cursor-pointer hover:opacity-80 transition-opacity">
                                    <input class="sr-only peer" type="checkbox" id="c_24h">
                                    <div class="w-9 h-5 bg-gray-200 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-primary"></div>
                                    <span class="ml-2 text-sm text-gray-700" for="c_24h">Abierto 24 horas</span>
                                </label>
                            </div>
                            <div class="col-span-12 md:col-span-4">
                                <label class="block text-sm font-medium text-gray-700 mb-1">IVA (%)</label>
                                <input type="number" step="0.01" min="0" id="c_tax" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-sm" required>
                            </div>
                            <div class="col-span-12 md:col-span-4">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Moneda</label>
                                <input type="text" id="c_currency" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-sm" value="COP" required>
                            </div>
                            <div class="col-span-12 md:col-span-4">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Zona horaria</label>
                                <input type="text" id="c_tz" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary text-sm" value="America/Bogota" required>
                            </div>
                            <div class="col-span-12">
                                <div id="alertSettings" class="hidden p-3 rounded-lg text-sm" role="alert"></div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/footer.js"></script>
    <script src="/js/settings.js"></script>
    <script src="/js/shifts.js"></script>
    <script src="/js/sidebar-logo.js"></script>
</body>
</html>
