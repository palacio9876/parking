<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="settings.title">ParkSystem - Configuración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/dashboard.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-bootstrap-4/bootstrap-4.min.css">
    <script>if(!localStorage.getItem('token')){window.location.href='/';}if(localStorage.getItem('userRole')!=='admin'){window.location.href='/admin/dashboard';}</script>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo-container"><div class="logo-circle"><span class="logo-text">PS</span></div></div>
            <h5 class="mt-3 text-white">ParkSystem</h5>
        </div>
        <nav class="sidebar-nav">
            <ul class="nav flex-column">
                <li class="nav-item"><a href="/admin/dashboard" class="nav-link"><i class="fas fa-tachometer-alt"></i><span data-i18n="sidebar.dashboard">Dashboard</span></a></li>
                <li class="nav-item"><a href="/admin/vehicles" class="nav-link"><i class="fas fa-car"></i><span data-i18n="sidebar.vehicles">Vehículos</span></a></li>
                <li class="nav-item"><a href="/admin/entry-exit" class="nav-link"><i class="fas fa-right-left"></i><span data-i18n="sidebar.entryExit">Ingreso / Salida</span></a></li>
                <li class="nav-item admin-only"><a href="/admin/settings" class="nav-link active"><i class="fas fa-gear"></i><span data-i18n="sidebar.settings">Configuración</span></a></li>
                <li class="nav-item admin-only"><a href="/admin/rates" class="nav-link"><i class="fas fa-money-bill-wave"></i><span data-i18n="sidebar.rates">Tarifas</span></a></li>
                <li class="nav-item admin-only"><a href="/admin/users" class="nav-link"><i class="fas fa-users"></i><span data-i18n="sidebar.users">Usuarios</span></a></li>
                <li class="nav-item admin-only"><a href="/admin/reports" class="nav-link"><i class="fas fa-chart-bar"></i><span data-i18n="sidebar.reports">Reportes</span></a></li>
            </ul>
        </nav>
        <div class="sidebar-footer"><a href="#" class="nav-link" id="btnLogout"><i class="fas fa-sign-out-alt"></i><span data-i18n="sidebar.logout">Cerrar Sesión</span></a></div>
    </div>

    <div class="main-content">
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
            <div class="container-fluid">
                <button class="btn btn-link sidebar-toggle"><i class="fas fa-bars"></i></button>
                <div class="navbar-collapse"><ul class="navbar-nav ms-auto"><li class="nav-item"><span class="nav-link"><i class="fas fa-user-circle me-2"></i><span id="userName">Usuario</span></span></li></ul></div>
            </div>
        </nav>

        <div class="container-fluid py-4">
            <div class="row g-4">
                <div class="col-12 col-xl-6">
                    <div class="card">
                        <div class="card-header bg-white d-flex justify-content-between align-items-center">
                            <h5 class="mb-0"><i class="fas fa-building me-2"></i><span data-i18n="settings.companyData">Datos de la Empresa</span></h5>
                            <button class="btn btn-primary btn-sm" id="btnSaveCompany"><i class="fas fa-save me-1"></i><span data-i18n="settings.save">Guardar</span></button>
                        </div>
                        <div class="card-body">
                            <form id="formEmpresa" class="row g-3">
                                <div class="col-md-8">
                                    <label class="form-label" data-i18n="settings.name">Nombre</label>
                                    <input type="text" id="e_name" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" data-i18n="settings.nit">NIT</label>
                                    <input type="text" id="e_tax_id" class="form-control" required>
                                </div>
                                <div class="col-md-8">
                                    <label class="form-label" data-i18n="settings.address">Dirección</label>
                                    <input type="text" id="e_address" class="form-control">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" data-i18n="settings.phone">Teléfono</label>
                                    <input type="text" id="e_phone" class="form-control">
                                </div>
                                <div class="col-md-8">
                                    <label class="form-label" data-i18n="settings.email">Email</label>
                                    <input type="email" id="e_email" class="form-control">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" data-i18n="settings.logo">Logo</label>
                                    <input type="file" id="e_logo_file" class="form-control" accept="image/*">
                                    <div class="mt-2">
                                        <img id="e_logo_preview" src="" data-i18n="settings.preview" alt="Vista previa" class="img-fluid rounded border d-none" style="max-height:80px">
                                    </div>
                                    <button type="button" id="btnUploadLogo" class="btn btn-outline-secondary btn-sm mt-2"><i class="fas fa-upload me-1"></i><span data-i18n="settings.upload">Subir</span></button>
                                </div>
                                <div class="col-12">
                                    <div id="alertCompany" class="alert d-none" role="alert"></div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-xl-6">
                    <div class="card">
                        <div class="card-header bg-white d-flex justify-content-between align-items-center">
                            <h5 class="mb-0"><i class="fas fa-sliders me-2"></i><span data-i18n="settings.configuration">Configuración</span></h5>
                            <button class="btn btn-primary btn-sm" id="btnSaveSettings"><i class="fas fa-save me-1"></i><span data-i18n="settings.save">Guardar</span></button>
                        </div>
                        <div class="card-body">
                            <form id="formConfig" class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label" data-i18n="settings.carCapacity">Cap. Carros</label>
                                    <input type="number" min="0" id="c_cars" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" data-i18n="settings.motorcycleCapacity">Cap. Motos</label>
                                    <input type="number" min="0" id="c_motos" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" data-i18n="settings.bicycleCapacity">Cap. Bicis</label>
                                    <input type="number" min="0" id="c_bicis" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" data-i18n="settings.opening">Apertura</label>
                                    <input type="time" id="c_opening" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" data-i18n="settings.closing">Cierre</label>
                                    <input type="time" id="c_closing" class="form-control" required>
                                </div>
                                <div class="col-12">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="c_24h">
                                        <label class="form-check-label" for="c_24h" data-i18n="settings.h24">Abierto 24 horas</label>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" data-i18n="settings.vat">IVA (%)</label>
                                    <input type="number" step="0.01" min="0" id="c_tax" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" data-i18n="settings.currency">Moneda</label>
                                    <input type="text" id="c_currency" class="form-control" value="COP" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" data-i18n="settings.timezone">Zona horaria</label>
                                    <input type="text" id="c_tz" class="form-control" value="America/Bogota" required>
                                </div>
                                <div class="col-12">
                                    <div id="alertSettings" class="alert d-none" role="alert"></div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="position-fixed top-0 end-0 p-3" style="z-index:1100"><div id="toastContainer"></div></div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/footer.js"></script>
    <script src="/js/settings.js"></script>
</body>
</html>
