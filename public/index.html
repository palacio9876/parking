<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkSystem - Inicio de Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/css/tailwind.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
</head>
<body class="font-poppins bg-gray-100">
    <div class="flex items-center justify-center min-h-screen px-4">
        <div class="w-full max-w-md md:max-w-lg lg:max-w-xl">
            <div class="bg-white/98 rounded-2xl shadow-lg animate-fade-in">
                <div class="p-8 md:p-10">
                    <div class="text-center mb-6">
<div class="flex justify-center items-center mb-4">
    <div class="w-20 h-20 bg-primary rounded-full flex items-center justify-center shadow-lg shadow-primary/20">
        <span class="text-white text-3xl font-semibold tracking-tight">PS</span>
    </div>
</div>
                        <h2 class="text-2xl font-bold text-primary">ParkSystem</h2>
                        <p class="text-gray-500 text-sm mt-1">Sistema de Gestión de Parqueadero</p>
                    </div>

                    <form id="loginForm" class="needs-validation" novalidate>
                        <div class="mb-5">
                            <label for="tax_id" class="block text-sm font-medium text-gray-700 mb-1">NIT Empresa</label>
                            <div class="flex">
                                <span class="inline-flex items-center px-3 bg-primary text-white rounded-l-lg">
                                    <i class="fas fa-building"></i>
                                </span>
                                <input type="text"
                                       class="w-full px-4 py-3 border border-gray-200 rounded-r-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-300 text-sm"
                                       id="tax_id"
                                       name="tax_id"
                                       required
                                      
                                       placeholder="Ej: 900123456-7"
                                       value="900123456-7">
                            </div>
                            <div class="invalid-feedback">
                                Por favor ingrese el NIT de la empresa
                            </div>
                        </div>

                        <div class="mb-5">
                            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                            <div class="flex">
                                <span class="inline-flex items-center px-3 bg-primary text-white rounded-l-lg">
                                    <i class="fas fa-user"></i>
                                </span>
                                <input type="text" class="w-full px-4 py-3 border border-gray-200 rounded-r-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-300 text-sm" id="username" name="username" required
                                      
                                       placeholder="Usuario">
                            </div>
                            <div class="invalid-feedback">
                                Por favor ingrese su usuario
                            </div>
                        </div>

                        <div class="mb-5">
                            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                            <div class="flex">
                                <span class="inline-flex items-center px-3 bg-primary text-white rounded-l-lg">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" class="w-full px-4 py-3 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-300 text-sm" id="password" name="password" required
                                      
                                       placeholder="Contraseña">
                                <button class="inline-flex items-center justify-center px-3 border border-l-0 border-gray-200 bg-white text-primary rounded-r-lg hover:bg-gray-50 transition-all duration-300" type="button" id="togglePassword">
                                    <i class="fas fa-eye" id="toggleIcon"></i>
                                </button>
                            </div>
                            <div class="invalid-feedback">
                                Por favor ingrese su contraseña
                            </div>
                        </div>

                        <div class="flex items-center mb-5">
                            <input type="checkbox" class="h-4 w-4 text-primary border-gray-300 rounded focus:ring-primary" id="recordar">
                            <label class="ml-2 text-sm text-gray-600" for="recordar">Recordar sesión</label>
                        </div>

                        <button type="submit" class="w-full bg-primary text-white font-medium py-3 px-4 rounded-lg hover:bg-primary-dark hover:shadow-lg hover:-translate-y-0.5 transition-all duration-300">
                            <span>Iniciar Sesión</span>
                        </button>

                        <div class="text-center mt-6">
                            <small class="text-sm text-gray-500">
                                ¿Olvidaste tu contraseña? Contacta al administrador
                            </small>
                        </div>
                    </form>
                </div>
            </div>

            <footer class="text-center mt-8">
                <div class="social-links"></div>
                <p class="mt-2 text-sm text-gray-500">Desarrollado por <span>Cristian Palacio</span></p>
            </footer>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
