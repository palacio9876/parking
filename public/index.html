<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login.title">ParkSystem - Inicio de Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-bootstrap-4/bootstrap-4.min.css">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row min-vh-100 align-items-center justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card login-card border-0 shadow-lg">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="logo-container mb-4">
                                <div class="logo-circle">
                                    <span class="logo-text">PS</span>
                                </div>
                            </div>
                            <h2 class="fw-bold text-primary">ParkSystem</h2>
                            <p class="text-muted" data-i18n="login.subtitle">Sistema de Gestión de Parqueadero</p>
                        </div>

                        <form id="loginForm" class="needs-validation" novalidate>
                            <div class="mb-4">
                                <label for="tax_id" class="form-label" data-i18n="login.taxId">NIT Empresa</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-primary text-white">
                                        <i class="fas fa-building"></i>
                                    </span>
                                    <input type="text" 
                                           class="form-control" 
                                           id="tax_id" 
                                           name="tax_id" 
                                           required 
                                           data-i18n="login.taxIdPlaceholder" data-i18n-attr="placeholder"
                                           placeholder="Ej: 900123456-7"
                                           value="900123456-7">
                                    <div class="invalid-feedback" data-i18n="login.taxIdRequired">
                                        Por favor ingrese el NIT de la empresa
                                    </div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="username" class="form-label" data-i18n="login.username">Usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-primary text-white">
                                        <i class="fas fa-user"></i>
                                    </span>
                                    <input type="text" class="form-control" id="username" name="username" required
                                           data-i18n="login.username" data-i18n-attr="placeholder"
                                           placeholder="Usuario">
                                    <div class="invalid-feedback" data-i18n="login.usernameRequired">
                                        Por favor ingrese su usuario
                                    </div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label" data-i18n="login.password">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-primary text-white">
                                        <i class="fas fa-lock"></i>
                                    </span>
                                    <input type="password" class="form-control" id="password" name="password" required
                                           data-i18n="login.password" data-i18n-attr="placeholder"
                                           placeholder="Contraseña">
                                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                        <i class="fas fa-eye" id="toggleIcon"></i>
                                    </button>
                                    <div class="invalid-feedback" data-i18n="login.passwordRequired">
                                        Por favor ingrese su contraseña
                                    </div>
                                </div>
                            </div>

                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="recordar">
                                <label class="form-check-label" for="recordar" data-i18n="login.remember">Recordar sesión</label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mb-3 py-2" data-i18n="login.button">
                                Iniciar Sesión
                            </button>

                            <div class="text-center">
                                <small class="text-muted" data-i18n="login.forgot">
                                    ¿Olvidaste tu contraseña? Contacta al administrador
                                </small>
                            </div>
                        </form>
                    </div>
                </div>

                <footer class="text-center mt-4">
                    <div class="social-links"></div>
                    <p class="mt-2 text-muted" data-i18n="footer.developedBy">Desarrollado por <span data-i18n="footer.company">Cristian Palacio</span></p>
                </footer>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
