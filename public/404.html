<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="errors.notFound">404 - Página no encontrada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins',sans-serif; background: linear-gradient(135deg,#f5f7fa 0%,#e4e8eb 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-container { text-align: center; padding: 2rem; }
        .error-code { font-size: 6rem; font-weight: 600; color: #1a237e; margin-bottom: 1rem; }
        .error-message { font-size: 1.5rem; color: #666; margin-bottom: 2rem; }
        .btn-primary { background-color: #1a237e; border-color: #1a237e; }
        .btn-primary:hover { background-color: #151b60; border-color: #151b60; }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-container">
            <div class="error-code">404</div>
            <div class="error-message" data-i18n="errors.notFound">¡Oops! Página no encontrada</div>
            <p class="mb-4" data-i18n="errors.notFoundMsg">La página que estás buscando no existe o ha sido movida.</p>
            <a href="/" class="btn btn-primary" data-i18n="errors.goHome">Volver al Inicio</a>
        </div>
    </div>
    <script src="/js/i18n.js"></script>
    <script src="js/footer.js"></script>
</body>
</html>
